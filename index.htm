<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 500px;
        }
        .btn {
            display: block;
            text-align: center;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #007bff;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="https://bassamitani.github.io/edugames/" target="_blank" class="btn">Edugames</a>
        <a href="https://bassamitani.github.io/Distributionmath/" target="_blank" class="btn">Distribution Math</a>
        <a href="https://bassamitani.github.io/icebreaker/" target="_blank" class="btn">Icebreaker</a>
        <a href="https://bassamitani.github.io/testsimulator/" target="_blank" class="btn">Test Simulator</a>
        <a href="https://bassamitani.github.io/quizzes/" target="_blank" class="btn">Quizzes</a>
        <a href="https://bassamitani.github.io/quizzes/sets.html" target="_blank" class="btn">Quizzes - Sets</a>
        <a href="https://bassamitani.github.io/quizzes/results.html" target="_blank" class="btn">Quizzes - Results</a>
        <a href="https://bassamitani.github.io/books/" target="_blank" class="btn">Books</a>
        <a href="https://bassamitani.github.io/million/" target="_blank" class="btn">Million</a>
        <a href="https://basita62.github.io/math-makassed-dashboard/" target="_blank" class="btn">Math Makassed Dashboard</a>
    </div>

</body>
</html>
